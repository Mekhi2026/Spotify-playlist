<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify</title>
  <style>
    /* Enables smooth scrolling animation */
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    /* Fixed navigation menu */
    .nav-menu {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    .nav-menu a {
      margin: 0 15px;
      text-decoration: none;
      color: #1DB954; /* Spotify Green */
      font-weight: bold;
    }
    /* Section containers to allow vertical scrolling space */
    .embed-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 60px; /* Offset for fixed menu */
    }
    .embed-container {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <!-- Navigation Buttons -->
  <nav class="nav-menu">
    <a href="#spotify-track-1">Go to Track 1</a>
    <a href="#spotify-track-2">Go to Track 2</a>
  </nav>

  <!-- Embed Section 1 -->
  <section id="spotify-track-1" class="embed-section">
    <h2>PLAYLIST1</h2>
    <div class="embed-container">
      <iframe src="https://open.spotify.com/embed/playlist/6Ai9GYgROsf09WYgYPQ8YT?utm_source=generator&si=67311123343f42c7" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </section>

  <!-- Embed Section 2 -->
  <section id="spotify-track-2" class="embed-section">
    <h2>PLAYLIST2</h2>
    <div class="embed-container">
      <iframe src="https://open.spotify.com/embed/playlist/6zvRVa1xBpxXrtFaLWi3Ni?utm_source=generator&si=3dbabe33efe24e0b" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </section>

</body>
</html>
